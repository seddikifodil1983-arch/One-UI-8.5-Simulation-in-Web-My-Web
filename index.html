<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One UI 8.5 Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-screen {
            width: 360px;
            height: 740px;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe') no-repeat center/cover;
            border: 12px solid #333;
            border-radius: 40px;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 25px;
            font-size: 14px;
            font-weight: bold;
        }

        /* Clock Area */
        .clock-container {
            text-align: center;
            margin-top: 50px;
        }
        .time {
            font-size: 64px;
            font-weight: 300;
        }
        .date {
            font-size: 18px;
            opacity: 0.8;
        }

        /* Notifications (Glassmorphism) */
        .notification-panel {
            margin: 40px 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .notif-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .app-icon {
            width: 40px;
            height: 40px;
            background: #2196F3;
            border-radius: 10px;
        }

        /* Bottom Navigation */
        .bottom-bar {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
        }
        .icon-circle {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="phone-screen">
        <div class="status-bar">
            <span>12:45</span>
            <span>📶 🔋 95%</span>
        </div>

        <div class="clock-container">
            <div class="time">12:45</div>
            <div class="date">الأربعاء، 18 مارس 2026</div>
        </div>

        <div class="notification-panel">
            <div class="notif-item">
                <div class="app-icon"></div>
                <div>
                    <div style="font-weight: bold;">نظام سامسونج</div>
                    <div style="font-size: 13px; opacity: 0.7;">تحديث One UI 8.5 جاهز للتثبيت...</div>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="icon-circle">📞</div>
            <div class="icon-circle">💬</div>
            <div class="icon-circle">📸</div>
        </div>
    </div>

</body>
</html>
